services:
  hermes-gateway:
    image: ${DOCKER_MIRROR}nousresearch/hermes-agent:latest
    container_name: hermes-gateway
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"
    volumes:
      - ${TRIM_PKGVAR:?}/data:/opt/data
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  hermes-dashboard:
    image: ${DOCKER_MIRROR}nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    command: dashboard --host 0.0.0.0 --insecure
    ports:
      - "${TRIM_SERVICE_PORT}:9119"
    volumes:
      - ${TRIM_PKGVAR:?}/data:/opt/data
    environment:
      - GATEWAY_HEALTH_URL=http://hermes-gateway:8642
      - TZ=Asia/Shanghai
    depends_on:
      - hermes-gateway
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
