services:
  hermes:
    image: ${DOCKER_MIRROR}nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: dashboard --host 0.0.0.0 --skip-build
    ports:
      - "${TRIM_SERVICE_PORT}:9119"
    volumes:
      - ${TRIM_PKGVAR:?}/data:/opt/data
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
