services:
  qwenpaw:
    image: ${DOCKER_MIRROR}docker.io/agentscope/qwenpaw:v${VERSION}
    container_name: qwenpaw
    init: true
    ports:
      - "${TRIM_SERVICE_PORT}:8088"
    volumes:
      - ${TRIM_PKGVAR:?}/data:/app/working
      - ${TRIM_PKGVAR:?}/secrets:/app/working.secret
      - ${TRIM_PKGVAR:?}/backups:/app/working.backups
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
