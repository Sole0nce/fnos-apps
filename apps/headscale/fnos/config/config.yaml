# Headscale 默认配置 — 基于上游 config-example.yaml 裁剪，仅改动 fnOS 相关的
# 监听地址与数据路径，其余保持上游默认值。
# __APP_DATA_DIR__ 由 bin/headscale-server 在首次启动投放配置时替换为真实路径。
# 本文件只在 @appdata 中不存在同名文件时投放，升级不会覆盖你的修改。
#
# ⚠️ 首次使用请务必修改 server_url：把 127.0.0.1 换成本机在局域网/公网的实际地址，
#    否则客户端无法连接。例如 http://192.168.1.10:8480
server_url: http://127.0.0.1:8480

# 监听全部网卡，这样局域网内的设备才能访问
listen_addr: 0.0.0.0:8480

# 指标接口只监听本机。刻意避开 9090（与 Prometheus 应用的默认端口冲突）
metrics_listen_addr: 127.0.0.1:8481

grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: __APP_DATA_DIR__/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: false
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: __APP_DATA_DIR__/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 198.51.100.1
    ipv6: 2001:db8::1
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 24h

disable_check_updates: false

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m
  routes:
    ha:
      probe_interval: 10s
      probe_timeout: 5s

database:
  type: sqlite
  debug: false
  gorm:
    prepare_stmt: true
    parameterized_queries: true
    skip_err_record_not_found: true
    slow_threshold: 1000
  sqlite:
    path: __APP_DATA_DIR__/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

log:
  level: info
  format: text

policy:
  mode: file
  path: ""

dns:
  magic_dns: true
  # base_domain 不能和 server_url 的主机名相同
  base_domain: headscale.internal
  override_local_dns: false
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
    split: {}
  search_domains: []
  extra_records: []

unix_socket: __APP_DATA_DIR__/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false
# 注：randomize_client_port 已被上游移除（0.29 起会直接 FATAL），
# 如需该行为请在 policy 文件顶层设置 "randomizeClientPort": true
